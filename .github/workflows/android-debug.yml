name: Android debug build
on:
  push:
    branches: [main, 'improvements/**']
  pull_request:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 37
        run: sdkmanager --install "platforms;android-37" "build-tools;37.0.0"
      - name: Build debug APK
        working-directory: android-app
        run: bash ./gradlew --no-daemon assembleDebug
      - name: Upload unsigned debug APK
        uses: actions/upload-artifact@v4
        with:
          name: control-laboral-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
